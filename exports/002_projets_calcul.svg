  <defs>
    <radialGradient id="glow_002_projets_calcul">
      <stop offset="0%" stop-color="#a0ffa0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a0ffa0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="620" fill="#0a0a12"/>

  <!-- Titre -->
  <text x="20" y="30" fill="#a0ffa0" font-size="14" font-weight="bold" letter-spacing="3">
    EXEGLYPHE 002
  </text>
  <text x="20" y="50" fill="#8888a0" font-size="10">
    Projects in Live Calculation
  </text>

  <!-- Animation SMIL : cercle pulsant + lignes rotatives -->
  <g transform="translate(250, 200)">
    <circle r="80" fill="none" stroke="#a0ffa0" stroke-width="0.5" opacity="0.3">
      <animate attributeName="r" values="80;90;80" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="none" stroke="#a0ffa0" stroke-width="0.5" opacity="0.4">
      <animate attributeName="r" values="60;70;60" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" fill="url(#glow_002_projets_calcul)">
      <animate attributeName="r" values="40;50;40" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- 12 lignes rotatives -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(30)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(60)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(90)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(120)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(150)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(180)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(210)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(240)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(270)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(300)"/>
      <line x1="0" y1="-90" x2="0" y2="-75" stroke="#a0ffa0" stroke-width="1.5" opacity="0.8" transform="rotate(330)"/>
    </g>

    <!-- Point central pulsant -->
    <circle r="8" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Formule -->
  <text x="250" y="330" fill="#a0ffa0" font-size="12" text-anchor="middle" opacity="0.8">
    r(t) = f(t)
  </text>

  <!-- QR code -->
  <image x="180" y="360" width="140" height="140"
         href="data:image/png;base64,"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         xlink:href="data:image/png;base64,"/>

