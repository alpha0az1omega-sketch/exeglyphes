  <text x="250" y="560" fill="#c0c0d8" font-size="8" text-anchor="middle" opacity="0.6">
    Scan to see live
  </text>
  <text x="250" y="575" fill="#a0ffa0" font-size="7" text-anchor="middle" opacity="0.7">
    alpha0az1omega-sketch.github.io/exeglyphes
  </text>

  <!-- Signature -->
  <text x="250" y="600" fill="#666680" font-size="7" text-anchor="middle">
